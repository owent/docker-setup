# ============================================================================
# AI / 大语言模型 (LLM) 领域 CDN 与模型资源缓存配置
# ============================================================================
# 主要域名:
#   - models.dev (模型目录站点, 静态资源 + /api.json)
#   - huggingface.co / hf-mirror.com (HF 主站与国内镜像, 元数据/resolve 跳转)
#   - cdn-lfs*.huggingface.co / cdn-lfs*.hf.co (HF LFS 模型文件 CDN, 签名 URL)
#   - cdn-lfs.hf-mirror.com (hf-mirror 的 LFS CDN)
#   - transfer.xethub.hf.co / cas-bridge.xethub.hf.co (HF Xet 存储, 按块哈希寻址)
#   - registry.ollama.ai (Ollama 模型仓库, blobs 按 sha256 内容寻址)
#   - download.pytorch.org (PyTorch 官方 wheel)
#   - pypi.nvidia.com / developer.download.nvidia.com (NVIDIA Python wheel / CUDA)
#   - openaipublic.blob.core.windows.net / openaipublic.azureedge.net
#     (tiktoken 编码表 / whisper / CLIP 等公开模型文件)
#   - dl.fbaipublicfiles.com (Meta SAM/DINO 等公开模型文件)
#   - storage.googleapis.com / commondatastorage.googleapis.com
#     (GCS 公开桶: keras/tf/jax/gemma 等模型权重, 仅匹配模型文件扩展名)
#   - modelscope.cn / www.modelscope.cn (ModelScope 模型仓库)
#   - ollama.com (Ollama 模型目录页)
#   - hf.co (HF 短链 302) / datasets-server.huggingface.co (数据集查看器 API)
#   - civitai.com / image.civitai.com (Civitai 模型市场/图片 CDN)
#   - replicate.com / *.replicate.delivery (Replicate 模型目录/权重 CDN)
#   - www.kaggle.com (Kaggle 模型/数据集目录)
#   - registry.modelcontextprotocol.io / smithery.ai (MCP 服务器注册表/目录)
#   - ai.gitee.com / hub.opencsg.com / wisemodel.cn / modelers.cn / openxlab.org.cn
#     (国内模型仓库, HF 类结构, 元数据为主)
#
# URL结构:
#   可长期缓存 (内容寻址/版本在路径中):
#     - cdn-lfs-us-1.huggingface.co/<oid>?X-Amz-Signature=... (签名参数仅用于鉴权)
#     - registry.ollama.ai/v2/library/<model>/blobs/sha256:<hash>
#     - download.pytorch.org/whl/cu121/torch-2.x.x...whl
#     - huggingface.co/<org>/<repo>/resolve/<rev>/<file> (302 跳转到 CDN)
#   短期缓存 (元数据/目录/跳转):
#     - huggingface.co/api/models/... (模型元数据 JSON)
#     - models.dev/api.json (模型目录 JSON)
#     - registry.ollama.ai/v2/library/<model>/manifests/<tag> (tag 可移动)
#
# 注意:
#   - huggingface.co 的 /resolve/ 返回 302, Location 中的签名 URL 数小时后过期,
#     因此对主站只做短期缓存, 避免缓存到过期签名。
#   - LLM API 端点 (api.openai.com / api.anthropic.com 等) 明确禁止缓存,
#     防止响应串数据与隐私泄露。
# ============================================================================

# -----------------------------------------------------------------------------
# ACL 定义 - 每个域名单独 ACL 以正确路由
# -----------------------------------------------------------------------------

# models.dev 模型目录站点
acl acl_models_dev dstdomain models.dev

# Hugging Face 主站与国内镜像 (元数据 / resolve 302)
acl acl_hf dstdomain huggingface.co
acl acl_hf_mirror dstdomain hf-mirror.com

# Hugging Face LFS CDN (签名 URL, 内容寻址)
acl acl_hf_lfs dstdomain cdn-lfs.huggingface.co
acl acl_hf_lfs dstdomain cdn-lfs-us-1.huggingface.co
acl acl_hf_lfs dstdomain cdn-lfs-eu-1.huggingface.co
acl acl_hf_lfs dstdomain cdn-lfs-us-1.hf.co
acl acl_hf_lfs dstdomain cdn-lfs-eu-1.hf.co
acl acl_hf_lfs dstdomain cdn-lfs.hf-mirror.com

# Hugging Face Xet 存储 (按块哈希寻址)
acl acl_hf_xet dstdomain transfer.xethub.hf.co
acl acl_hf_xet dstdomain cas-bridge.xethub.hf.co

# Ollama 模型仓库
acl acl_ollama dstdomain registry.ollama.ai

# PyTorch / NVIDIA
acl acl_pytorch dstdomain download.pytorch.org
acl acl_nvidia_pypi dstdomain pypi.nvidia.com
acl acl_nvidia_dl dstdomain developer.download.nvidia.com

# OpenAI / Meta 公开模型文件
acl acl_openaipublic dstdomain openaipublic.blob.core.windows.net
acl acl_openaipublic dstdomain openaipublic.azureedge.net
acl acl_fbaipublic dstdomain dl.fbaipublicfiles.com

# Google Cloud Storage 公开桶 (模型权重)
acl acl_gcs dstdomain storage.googleapis.com
