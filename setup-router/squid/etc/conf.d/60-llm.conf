acl acl_replicate_dl dstdomain weights.replicate.delivery
acl acl_replicate_dl dstdomain pbxt.replicate.delivery

# Kaggle 模型/数据集目录
acl acl_kaggle dstdomain www.kaggle.com

# MCP 服务器注册表/目录 (agent 工具发现)
acl acl_mcp_registry dstdomain registry.modelcontextprotocol.io
acl acl_smithery dstdomain smithery.ai

# 国内模型仓库 (HF 类结构, 元数据为主)
acl acl_cn_modelhub dstdomain ai.gitee.com
acl acl_cn_modelhub dstdomain hub.opencsg.com
acl acl_cn_modelhub dstdomain opencsg.com
acl acl_cn_modelhub dstdomain wisemodel.cn
acl acl_cn_modelhub dstdomain modelers.cn
acl acl_cn_modelhub dstdomain openxlab.org.cn

