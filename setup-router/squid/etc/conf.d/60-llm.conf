# -----------------------------------------------------------------------------
# Store ID 访问控制
# -----------------------------------------------------------------------------

# 签名/跟踪参数可安全移除的域名做 store_id 重写:
#   - HF LFS / Xet (内容寻址, 参数为签名)
#   - Ollama blobs (sha256 内容寻址)
#   - PyTorch / NVIDIA / OpenAI / Meta 公开文件 (版本在路径中)
#   - GCS 公开模型文件 (仅匹配模型文件扩展名, 见 script/domains/llm.py)
#   - models.dev 静态资源 (哈希文件名)
store_id_access allow acl_models_dev
store_id_access allow acl_hf_lfs
store_id_access allow acl_hf_xet
store_id_access allow acl_ollama
store_id_access allow acl_pytorch
store_id_access allow acl_nvidia_pypi
store_id_access allow acl_nvidia_dl
store_id_access allow acl_openaipublic
store_id_access allow acl_fbaipublic
store_id_access allow acl_gcs
store_id_access allow acl_replicate_dl

# 以下不做 store_id 重写 (参数影响返回内容):
#   - huggingface.co / hf-mirror.com (API 查询参数影响内容)
#   - modelscope.cn (?Revision=&FilePath= 决定返回哪个文件)
#   - civitai.com / image.civitai.com (图片变换参数如 width/original 影响内容)
#   - 模型目录/市场站点 (kaggle/opencsg/gitee 等, 查询参数影响内容)

# -----------------------------------------------------------------------------
# 缓存规则
# -----------------------------------------------------------------------------

# LLM API 端点禁止缓存 (规则靠前, 优先匹配)
cache deny llm_api

cache allow llm_all

# -----------------------------------------------------------------------------
# 刷新策略
# -----------------------------------------------------------------------------

# --- Hugging Face LFS / Xet: 内容寻址, 30天 min, 365天 max ---
refresh_pattern -i (cdn-lfs[^/]*\.(huggingface\.co|hf\.co|hf-mirror\.com)|transfer\.xethub\.hf\.co|cas-bridge\.xethub\.hf\.co)/ 43200 100% 525600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate

# --- Hugging Face 主站/镜像: 元数据与 302 跳转, 短期缓存 ---
# /resolve/ 的 302 Location 含签名 URL (数小时过期), 不可长缓存
# 5分钟 min, 24小时 max
refresh_pattern -i (huggingface\.co|hf-mirror\.com)/ 5 50% 1440 ignore-no-cache refresh-ims

# --- Ollama ---
# blobs (sha256 内容寻址): 30天 min, 365天 max
refresh_pattern -i registry\.ollama\.ai/v2/.*/blobs/sha256: 43200 100% 525600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate
# manifests / 其它 (tag 可移动): 1小时 min, 24小时 max
refresh_pattern -i registry\.ollama\.ai/ 60 50% 1440 override-expire ignore-reload

# --- PyTorch / NVIDIA: 版本在路径中, 30天 min, 365天 max ---
refresh_pattern -i download\.pytorch\.org/whl/ 43200 100% 525600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate
refresh_pattern -i pypi\.nvidia\.com/ 43200 100% 525600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate
refresh_pattern -i developer\.download\.nvidia\.com/ 43200 100% 525600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate

# --- OpenAI / Meta 公开模型文件: 不可变, 30天 min, 365天 max ---
refresh_pattern -i openaipublic\.(blob\.core\.windows\.net|azureedge\.net)/ 43200 100% 525600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate
refresh_pattern -i dl\.fbaipublicfiles\.com/ 43200 100% 525600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate

# --- GCS 公开模型文件: 仅模型权重类扩展名长缓存, 30天 min, 365天 max ---
# 其它 GCS 路径不做覆盖 (可能有 alt=media / 签名参数语义)
refresh_pattern -i (storage\.googleapis\.com|commondatastorage\.googleapis\.com)/.*\.(safetensors|bin|gguf|ckpt|pt|pth|h5|pb|onnx|tflite|npz|msgpack)(\?.*)?$ 43200 100% 525600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate

# --- ModelScope ---
# 模型文件 (api/v1/models/.../repo?FilePath=...): 1天 min, 30天 max
# 同一 URL 内容基本不变, 但 Revision=master 会随仓库更新, 不用过长
refresh_pattern -i (www\.)?modelscope\.cn/api/v1/models/.*/repo 1440 100% 43200 override-expire ignore-reload ignore-no-store ignore-private
# 元数据/页面: 短缓存
refresh_pattern -i (www\.)?modelscope\.cn/ 30 50% 720

# --- models.dev ---
# 哈希静态资源 (/_astro/): 7天 min, 90天 max
refresh_pattern -i models\.dev/_astro/ 10080 100% 129600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate
# 模型目录 JSON: 1小时 min, 24小时 max
refresh_pattern -i models\.dev/api\.json 60 50% 1440 override-expire ignore-reload refresh-ims
# HTML/其它: 短缓存
refresh_pattern -i models\.dev/ 30 50% 720 refresh-ims

# --- Replicate 权重 CDN (*.replicate.delivery): 签名 URL, 内容不可变 ---
# 30天 min, 365天 max
refresh_pattern -i \.replicate\.delivery/ 43200 100% 525600 override-expire ignore-reload ignore-no-store ignore-private ignore-must-revalidate

# --- Civitai 图片 CDN: UUID 寻址, 7天 min, 30天 max ---
refresh_pattern -i image\.civitai\.com/ 10080 100% 43200 override-expire ignore-reload ignore-no-store ignore-private

# --- 模型目录/市场站点: 元数据为主, 短缓存 ---
# 目录页/搜索/API 均可能更新, 遵循源站缓存策略, ims 验证减少回源字节
refresh_pattern -i (www\.)?ollama\.com/ 30 50% 720 refresh-ims
refresh_pattern -i hf\.co/ 30 50% 720 refresh-ims
refresh_pattern -i datasets-server\.huggingface\.co/ 30 50% 1440 refresh-ims
refresh_pattern -i civitai\.com/ 5 50% 720 refresh-ims
refresh_pattern -i replicate\.com/ 5 50% 720 refresh-ims
refresh_pattern -i www\.kaggle\.com/ 5 50% 720 refresh-ims
refresh_pattern -i registry\.modelcontextprotocol\.io/ 30 50% 1440 refresh-ims
refresh_pattern -i smithery\.ai/ 30 50% 1440 refresh-ims

# --- 国内模型仓库 (HF 类结构): 元数据为主, 短缓存 ---
# LFS 文件路径/签名结构各异, 保守处理; 认证请求不缓存 (Caddy/ATS 前端控制)
refresh_pattern -i (ai\.gitee\.com|hub\.opencsg\.com|opencsg\.com|wisemodel\.cn|modelers\.cn|openxlab\.org\.cn)/ 5 50% 720 refresh-ims
